<script>
  // Theme before first paint, so a dark-mode launch never flashes paper.
  try {
    var s = JSON.parse(localStorage.getItem('barracks-pt.v1') || '{}').settings || {};
    if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
  } catch (e) {}
</script>
<script type="module" src="js/app.js?v=1"></script>

<body>
<div id="app">
  <main id="tabs">
    <section class="tab" id="tab-today" data-tab="today" aria-label="Today"></section>
    <section class="tab" id="tab-plan" data-tab="plan" aria-label="Plan" hidden></section>
    <section class="tab" id="tab-progress" data-tab="progress" aria-label="Progress" hidden></section>
    <section class="tab" id="tab-more" data-tab="more" aria-label="More" hidden></section>
  </main>
  <nav class="tabbar" aria-label="Sections">
    <button type="button" class="tabbtn" data-act="tab" data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.25"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/><circle cx="12" cy="12" r="1.6" class="fill"/></svg>
      <span>Today</span>
    </button>
    <button type="button" class="tabbtn" data-act="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10M14.5 9.5v10"/></svg>
      <span>Plan</span>
    </button>
    <button type="button" class="tabbtn" data-act="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5h17"/><path d="M6 20.5v-5h3v5M10.5 20.5v-9h3v9M15 20.5V6h3v14.5"/></svg>
      <span>Progress</span>
    </button>
    <button type="button" class="tabbtn" data-act="tab" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>
      <span>More</span>
    </button>
  </nav>
</div>
<div id="session" class="session" hidden></div>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Barracks PT needs JavaScript turned on.</p></noscript>
